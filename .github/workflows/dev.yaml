name: Deploy Node.js Backend - Security Gate & Deploy

on:
    push:
        branches:
            - developement

env:
    # --- SonarCloud Configuration ---
    # These must be set as Secrets in your GitHub Repository
    SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }} # e.g., 'your-company_backend-repo'
    SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
    SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Defaults to https://sonarcloud.io
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
    # --------------------------------------------------------------------------
    # 1. SECURITY/QUALITY GATE (SONARCLOUD)
    # --------------------------------------------------------------------------
    sonarqube-scan:
        name: Code Quality Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Required for deep analysis and tracking of code changes
                  fetch-depth: 0

            - name: SonarCloud Scan
              # This action handles dependency installation and runs the scan
              uses: SonarSource/sonarcloud-github-action@v2.2
              env:
                  #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used by SonarCloud for PR decoration
                  SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
              with:
                  # Uses the project key/organization defined in the environment variables
                  projectBaseDir: .

            - name: Wait for Quality Gate Status
              # This action pauses the workflow and queries SonarCloud for the result.
              # If the Quality Gate is 'FAILED', this step fails, and the deployment is blocked.
              uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
              timeout-minutes: 5 # Time out if the status takes too long
              env:
                  SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

    # --------------------------------------------------------------------------
    # 2. DEPLOYMENT (BLOCKED by SonarCloud Gate)
    # --------------------------------------------------------------------------
    deploy-backend:
        # CRITICAL: This line ensures deployment only runs if the scan job was successful.
        needs: [sonarqube-scan]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Deploy backend files via FTP
              # Existing FTP deployment step
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER_TEST }}
                  username: ${{ secrets.FTP_USERNAME_TEST }}
                  password: ${{ secrets.FTP_PASSWORD_TEST }}
                  local-dir: ./
                  server-dir: /public_html/
                  dangerous-clean-slate: false
                  exclude: |
                      **/node_modules/**
                      **/.git*
                      **/.github/**
                      **/frontend/**
                      **/build/**
                      **/package-lock.json
