name: Deploy Node.js Backend - Security Gate & Deploy

on:
    push:
        branches:
            - staging

env:
    SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
    SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
    sonarqube-scan:
        name: Code Quality Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            checks: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: SonarCloud Scan with Quality Gate
              uses: SonarSource/sonarcloud-github-action@v2.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
              with:
                  projectBaseDir: .
                  args: >
                      -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
                      -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}

    deploy-backend:
        needs: [sonarqube-scan]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Deploy backend files via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER_TEST }}
                  username: ${{ secrets.FTP_USERNAME_TEST }}
                  password: ${{ secrets.FTP_PASSWORD_TEST }}
                  local-dir: ./
                  server-dir: /public_html/
                  dangerous-clean-slate: false
                  exclude: |
                      **/node_modules/**
                      **/.git*
                      **/.github/**
                      **/frontend/**
                      **/build/**
                      **/package-lock.json
