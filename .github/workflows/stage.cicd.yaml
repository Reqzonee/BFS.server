name: Deploy Node.js Backend - Security Gate & Deploy

on:
  push:
    branches:
      - staging

env:
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  #   sonarqube-scan:
  #     name: Code Quality Check
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read
  #       pull-requests: write
  #       checks: write
  #     steps:
  #       - name: Checkout repository
  #         uses: actions/checkout@v4
  #         with:
  #           fetch-depth: 0

  #       - name: SonarCloud Scan with Quality Gate
  #         uses: SonarSource/sonarcloud-github-action@v2.2
  #         env:
  #           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #           SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
  #         with:
  #           projectBaseDir: .
  #           args: >
  #             -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
  #             -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}

  deploy-backend:
    # needs: [sonarqube-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment artifact
        run: |
          tar -czf deploy.tar.gz \
            --exclude='deploy.tar.gz' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='frontend' \
            --exclude='build' \
            --exclude='package-lock.json' \
            .

      - name: Upload artifact via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.FTP_USERNAME_TEST }}/"

      - name: Extract and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Define vars
            DEPLOY_DIR="/home/${{ secrets.FTP_USERNAME_TEST }}/public_html/"
            ARTIFACT="/home/${{ secrets.FTP_USERNAME_TEST }}/deploy.tar.gz"

            # Create deployment directory if not exists
            mkdir -p $DEPLOY_DIR

            # Extract with permission handling
            # -m: don't extract modified time
            # --no-same-owner: extract as current user
            tar -xzf $ARTIFACT -C $DEPLOY_DIR -m --no-same-owner

            # Cleanup artifact
            rm $ARTIFACT

            # Navigate to project
            cd $DEPLOY_DIR

            # Load NVM (Needed for non-interactive SSH shells to find npm/node)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Run commands
            npm install
            pm2 restart process.json || pm2 start process.json --name "${{ secrets.FTP_USERNAME_TEST }}"
            pm2 save
